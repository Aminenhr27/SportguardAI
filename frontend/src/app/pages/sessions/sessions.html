<h2>Nouvelle séance</h2>

<form (ngSubmit)="save()">
  <label>
    ID de l'athlète
    <input type="number" name="athleteId" min="1" [(ngModel)]="athleteId" />
  </label>
  <label>
    Date
    <input type="date" name="date" [(ngModel)]="date" />
  </label>
  <label>
    Durée (minutes)
    <input type="number" name="duration" min="1" [(ngModel)]="duration" />
  </label>
  <label>
    Intensité : {{ intensity }} / 10
    <input type="range" name="intensity" min="1" max="10" [(ngModel)]="intensity" />
  </label>
  <label>
    Type
    <select name="trainingType" [(ngModel)]="trainingType">
      <option value="force">Force</option>
      <option value="cardio">Cardio</option>
      <option value="technique">Technique</option>
      <option value="match">Match</option>
    </select>
  </label>
  <button type="submit">Enregistrer la séance</button>
</form>

@if (message()) {
  <p>{{ message() }}</p>
}
@if (error()) {
  <p>{{ error() }}</p>
}
